<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fitness Hub - Entrenar</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="app">
  <header class="barra">
    <div class="barra-contenido">
      <a class="logo" href="/inicio.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" /></svg>
        <span>Fitness Hub</span>
      </a>
      <a href="/inicio.html">Volver al inicio</a>
    </div>
  </header>

  <main class="contenido">
    <div class="avisos" aria-live="polite">
      <p id="mensaje"></p>
    </div>

    <!-- Vista 1: elegir cómo empezar -->
    <section id="vista-empezar" hidden>
      <div class="bienvenida cabecera-con-boton">
        <div>
          <h1>Entrenar</h1>
          <p id="resumen-rutinas">Elige una rutina o entrena sin plan.</p>
        </div>
        <button id="btn-libre" type="button">Entreno libre</button>
      </div>
      <ul id="lista-rutinas" class="lista-rutinas"></ul>
    </section>

    <!-- Vista 2: el entreno en curso -->
    <section id="vista-entreno" hidden>
      <div class="bienvenida">
        <h1 id="titulo-entreno">Entreno</h1>
        <p id="detalle-entreno"></p>
      </div>

      <div id="bloques" class="bloques-entreno"></div>

      <div class="panel anadir-ejercicio">
        <label for="ej-buscar">Añadir ejercicio</label>
        <input id="ej-buscar" type="search" placeholder="Buscar: press, curl, sentadilla…" autocomplete="off" />
        <div class="fila-anadir">
          <select id="ej-select" aria-label="Ejercicio a añadir"></select>
          <button id="btn-anadir" type="button" class="btn-secundario">Añadir</button>
        </div>
      </div>

      <div class="acciones-editor">
        <button id="btn-terminar" type="button">Terminar entreno</button>
        <button id="btn-descartar" type="button" class="btn-peligro">Descartar</button>
      </div>
    </section>
  </main>

  <script type="module" src="./entreno.js"></script>
</body>
</html>
