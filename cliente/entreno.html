<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fitness Hub - Entrenar</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="app">
  <header class="barra">
    <div class="barra-contenido">
      <a class="logo" href="/inicio.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" /></svg>
        <span>Fitness Hub</span>
      </a>
      <a href="/inicio.html">Volver al inicio</a>
    </div>
  </header>

  <main class="contenido">
    <div class="avisos" aria-live="polite">
      <p id="mensaje"></p>
    </div>

    <!-- Vista 1: elegir cómo empezar -->
    <section id="vista-empezar" hidden>
      <div class="bienvenida cabecera-con-boton">
        <div>
          <h1>Entrenar</h1>
          <p id="resumen-rutinas">Elige una rutina o entrena sin plan.</p>
        </div>
        <button id="btn-libre" type="button">Entreno libre</button>
      </div>
      <ul id="lista-rutinas" class="lista-rutinas"></ul>
    </section>

    <!-- Vista 2: el entreno en curso -->
    <section id="vista-entreno" hidden>
      <div class="bienvenida">
        <h1 id="titulo-entreno">Entreno</h1>
        <p id="detalle-entreno"></p>
      </div>

      <div id="bloques" class="bloques-entreno"></div>

      <div class="panel anadir-ejercicio">
        <label for="ej-buscar">Añadir ejercicio</label>
        <input id="ej-buscar" type="search" placeholder="Buscar: press, curl, sentadilla…" autocomplete="off" />
        <div class="fila-anadir">
          <select id="ej-select" aria-label="Ejercicio a añadir"></select>
          <button id="btn-anadir" type="button" class="btn-secundario">Añadir</button>
        </div>
      </div>

      <div class="acciones-editor">
        <button id="btn-terminar" type="button">Terminar entreno</button>
        <button id="btn-descartar" type="button" class="btn-peligro">Descartar</button>
      </div>

      <!-- Al marcar una serie: ventana modal que bloquea la página hasta empezar el descanso o saltarlo.
           <dialog> + showModal() es la ventana modal nativa del navegador (fondo oscuro, Esc = saltar). -->
      <dialog id="dialogo-descanso" class="dialogo-descanso" aria-labelledby="dialogo-titulo">
        <h2 id="dialogo-titulo">Serie hecha ✓</h2>
        <p>Descanso</p>
        <div class="dialogo-ajuste">
          <button type="button" class="btn-secundario" data-proponer="-15" aria-label="Quitar 15 segundos">−15</button>
          <strong id="dialogo-tiempo" class="descanso-tiempo">1:30</strong>
          <button type="button" class="btn-secundario" data-proponer="15" aria-label="Añadir 15 segundos">+15</button>
        </div>
        <div class="dialogo-acciones">
          <button id="btn-empezar-descanso" type="button">Empezar descanso</button>
          <button id="btn-saltar-descanso" type="button" class="btn-secundario">Saltar</button>
        </div>
      </dialog>

      <!-- Temporizador de descanso (T-40): fijo abajo, a mano del pulgar. Solo se ve durante un descanso. -->
      <div id="barra-descanso" class="barra-descanso" hidden>
        <div class="descanso-fila">
          <span id="descanso-etiqueta" aria-live="polite">Descanso</span>
          <strong id="descanso-tiempo" class="descanso-tiempo">0:00</strong>
          <button id="btn-saltar" type="button" class="btn-secundario">Saltar</button>
        </div>
        <div class="descanso-botones">
          <button type="button" class="btn-secundario" data-sumar="-15" aria-label="Quitar 15 segundos">−15</button>
          <button type="button" class="btn-secundario" data-fijar="60" aria-label="Descanso de 60 segundos">60</button>
          <button type="button" class="btn-secundario" data-fijar="90" aria-label="Descanso de 90 segundos">90</button>
          <button type="button" class="btn-secundario" data-fijar="120" aria-label="Descanso de 120 segundos">120</button>
          <button type="button" class="btn-secundario" data-sumar="15" aria-label="Añadir 15 segundos">+15</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./entreno.js"></script>
</body>
</html>
