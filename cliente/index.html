<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fitness Hub - Acceso</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>Fitness Hub</h1>
      <p id="estado">Sin sesión</p>
    </header>

    <div class="avisos" aria-live="polite">
      <p id="mensaje"></p>
    </div>

    <nav class="pestanas">
      <button id="tab-login" type="button" class="activa">Entrar</button>
      <button id="tab-registro" type="button">Crear cuenta</button>
    </nav>

    <section id="panel-login">
      <h2>Entrar</h2>
      <form id="form-login">
        <input id="log-email" type="email" placeholder="email" required />
        <input id="log-pass" type="password" placeholder="contraseña" required />
        <button type="submit">Iniciar sesión</button>
      </form>
      <a class="btn-github" href="/api/oauth/github">Entrar con GitHub</a>
    </section>

    <section id="panel-registro" hidden>
      <h2>Crear cuenta</h2>
      <form id="form-registro">
        <input id="reg-email" type="email" placeholder="email" required />
        <input id="reg-pass" type="password" placeholder="contraseña (min 6)" required minlength="6" />
        <button type="submit">Crear cuenta</button>
      </form>
      <button id="btn-activar" type="button">Ya tengo el enlace: activar mi cuenta (provisional)</button>
    </section>

    <button id="btn-logout" type="button">Cerrar sesión</button>
  </main>

  <script type="module" src="./controlador.js"></script>
</body>
</html>
