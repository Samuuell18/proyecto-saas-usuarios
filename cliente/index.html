<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- T-54: la web como app instalable (PWA) en Android e iPhone. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/iconos/icono.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Forja" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Forja - Acceso</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <script src="/presentacion/tema.js"></script>
</head>
<body class="acceso">
  <div class="acceso-grid">
    <aside class="marca">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" /></svg>
        <span>Forja</span>
      </div>
      <h1>Planifica. Entrena. Progresa.</h1>
      <p>Tus rutinas, tus entrenos y tu evolución en un solo sitio.</p>
    </aside>

    <main class="tarjeta">
      <p id="estado">Sin sesión</p>

      <div class="avisos" aria-live="polite">
        <p id="mensaje"></p>
      </div>

      <nav class="pestanas">
        <button id="tab-login" type="button" class="activa">Entrar</button>
        <button id="tab-registro" type="button">Crear cuenta</button>
      </nav>

      <section id="panel-login">
        <h2>Bienvenido de nuevo</h2>
        <form id="form-login">
          <label for="log-email">Email</label>
          <input id="log-email" type="email" placeholder="tu@email.com" autocomplete="email" required />
          <label for="log-pass">Contraseña</label>
          <input id="log-pass" type="password" placeholder="Tu contraseña" autocomplete="current-password" required />
          <button type="submit">Iniciar sesión</button>
        </form>
        <!-- Solo se muestra si el enlace caducó o la cuenta sigue pendiente (T-26). -->
        <button id="btn-reenviar" type="button" hidden>Reenviar enlace de confirmación</button>
        <p class="separador"><span>o</span></p>
        <div class="oauth">
          <a class="btn-google" href="/api/oauth/google">
            <!-- Logo oficial de Google ("G" de cuatro colores), como piden sus normas de marca. -->
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            <span>Continuar con Google</span>
          </a>
        </div>
      </section>

      <section id="panel-registro" hidden>
        <h2>Crea tu cuenta</h2>
        <form id="form-registro">
          <label for="reg-nombre">Nombre</label>
          <input id="reg-nombre" type="text" placeholder="¿Cómo te llamas?" autocomplete="given-name" required minlength="2" maxlength="40" />
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="tu@email.com" autocomplete="email" required />
          <label for="reg-pass">Contraseña</label>
          <input id="reg-pass" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required minlength="8" />
          <button type="submit">Crear cuenta</button>
        </form>
        <!-- T-86: con Google, crear cuenta y entrar son lo mismo (la cuenta nace activa). -->
        <p class="separador"><span>o</span></p>
        <div class="oauth">
          <a class="btn-google" href="/api/oauth/google">
            <!-- Logo oficial de Google ("G" de cuatro colores), como piden sus normas de marca. -->
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            <span>Continuar con Google</span>
          </a>
        </div>
      </section>

      <button id="btn-logout" type="button" hidden>Cerrar sesión</button>

      <p class="pie"><a href="/privacidad.html">Política de privacidad</a></p>
    </main>
  </div>

  <script type="module" src="./presentacion/acceso.js"></script>
</body>
</html>
