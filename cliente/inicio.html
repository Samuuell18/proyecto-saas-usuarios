<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- T-54: la web como app instalable (PWA) en Android e iPhone. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/iconos/icono.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Forja" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Forja - Inicio</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <script src="/presentacion/tema.js"></script>
</head>
<body class="app">
  <header class="barra">
    <div class="barra-contenido">
      <a class="logo" href="/inicio.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" /></svg>
        <span>Forja</span>
      </a>
    </div>
  </header>

  <main class="contenido">
    <div class="avisos" aria-live="polite">
      <p id="mensaje"></p>
    </div>

    <section class="bienvenida">
      <p id="fecha-hoy" class="fecha-hoy"></p>
      <h1 id="saludo">Hola</h1>
    </section>

    <!-- T-61: lo importante de hoy, en una tarjeta: seguir el entreno, la rutina que toca o crear la primera. -->
    <section id="tarjeta-hoy" class="tarjeta-hoy" aria-live="polite">
      <p id="hoy-etiqueta" class="tarjeta-hoy-etiqueta">Cargando…</p>
      <h2 id="hoy-titulo">&nbsp;</h2>
      <p id="hoy-detalle" class="tarjeta-hoy-detalle">&nbsp;</p>
      <button id="hoy-accion" type="button" class="tarjeta-hoy-boton" hidden></button>
      <a id="hoy-libre" class="tarjeta-hoy-libre" href="/entreno.html" hidden>o entrena sin rutina</a>
    </section>

    <section class="cifras cifras-hoy" aria-label="Tu semana">
      <div class="panel cifra"><span id="cifra-semana">–</span><p>entrenos<br />esta semana</p></div>
      <div class="panel cifra"><span id="cifra-racha">–</span><p id="texto-racha">semanas<br />seguidas</p></div>
      <div class="panel cifra"><span id="cifra-record">–</span><p id="texto-record">último<br />récord</p></div>
    </section>

    <nav class="accesos-hoy" aria-label="Más">
      <a class="panel acceso-hoy" href="/ejercicios.html">
        <strong>Ejercicios</strong>
        <span>Catálogo y los tuyos</span>
      </a>
      <a class="panel acceso-hoy" href="/historial.html">
        <strong>Historial</strong>
        <span>Tus entrenos, serie a serie</span>
      </a>
    </nav>

    <section id="panel-admin" class="panel" hidden>
      <h2>Usuarios</h2>
      <div class="tabla-scroll">
        <table id="tabla-usuarios">
          <thead>
            <tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- T-60: las cuentas sin nombre (anteriores a pedirlo, u OAuth sin nombre) lo escriben aquí. -->
  <dialog id="dialogo-nombre" class="dialogo-descanso">
    <form id="form-pedir-nombre">
      <h2>¿Cómo te llamas?</h2>
      <p>Lo usaremos para saludarte en la app.</p>
      <input id="pedir-nombre" type="text" autocomplete="given-name" required minlength="2" maxlength="40" placeholder="Tu nombre" />
      <p id="error-nombre" class="error-dialogo" aria-live="polite"></p>
      <button type="submit">Guardar</button>
    </form>
  </dialog>

  <script type="module" src="./presentacion/inicio.js"></script>
</body>
</html>
